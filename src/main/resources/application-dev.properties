# .env.dev
spring.config.import=optional:file:.env.dev[.properties]
# dataSource - pgvector -> postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver
# openai - groq
# https://console.groq.com/keys
spring.ai.openai.api-key=${GROQ_API_KEY}
# https://console.groq.com/docs/openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# https://console.groq.com/docs/models
# https://console.groq.com/docs/rate-limits
# model -> chat.model
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.2
# genai - gemini-embedding-001
# https://ai.google.dev/gemini-api/docs/embeddings?hl=ko
# https://ai.google.dev/gemini-api/docs/models/gemini-embedding-001?hl=ko
# https://aistudio.google.com/rate-limit?timeRange=last-1-day
spring.ai.model.embedding=none
# openai를 따라가기 때문에 genai를 쓸 때는 비활성
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:empty}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536
# 768, 1536, 3072 -> pgvector 2000 -> 1536
# pgvector
# pgvector extenstion 구동은 직접해야함
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
# index-type, distance-type
# spring.ai.vectorstore.pgvector.index-type=HNSW
# spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# 로깅 (ai 관련 내용 상세히)
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.vectorstore=DEBUG
